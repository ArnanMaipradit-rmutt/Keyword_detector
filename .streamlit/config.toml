[server]
# Max upload size per file in megabytes (MB). Default was 200 MB, increased to 1024 MB (1 GB).
maxUploadSize = 1024
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#10B981"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
font = "sans serif"
